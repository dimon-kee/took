<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' file:; media-src 'self' file:"
    />
    <title data-i18n="app.editor">Took</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <video id="player" class="hidden" playsinline></video>
      <img id="still" class="hidden" alt="" />
    </div>

    <div class="controls">
      <div class="track-row">
        <span class="track-label" data-i18n="editor.play"></span>
        <div class="track" id="track">
          <div class="track-fill" id="track-fill"></div>
          <div class="track-head" id="track-head"></div>
        </div>
      </div>

      <div class="button-row">
        <button class="play" id="btn-play" data-i18n-title="editor.playPause">
          <svg viewBox="0 0 20 20" width="17" height="17" id="glyph-play">
            <path d="M5.6 3.6 L16 10 L5.6 16.4 Z" fill="currentColor" />
          </svg>
          <svg viewBox="0 0 20 20" width="17" height="17" id="glyph-pause" class="hidden">
            <rect x="5" y="3.8" width="3.6" height="12.4" rx="1" fill="currentColor" />
            <rect x="11.4" y="3.8" width="3.6" height="12.4" rx="1" fill="currentColor" />
          </svg>
        </button>
        <span class="time"><span id="now">00:00:00</span> / <span id="total">00:00:00</span></span>
        <span class="spacer"></span>
        <button class="action" id="btn-save" data-i18n="editor.download"></button>
        <button class="action" id="btn-copy" data-i18n="editor.copy"></button>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
    <script src="editor.js"></script>
  </body>
</html>
