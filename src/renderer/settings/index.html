<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <title data-i18n="app.settings">Took</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section>
        <h2 data-i18n="settings.general"></h2>

        <div class="row">
          <label data-i18n="settings.language"></label>
          <div class="options" id="lang-row"></div>
        </div>

        <div class="row">
          <label for="auto-launch" data-i18n="settings.startup"></label>
          <label class="check">
            <input type="checkbox" id="auto-launch" />
            <i></i>
            <span data-i18n="settings.autoLaunch"></span>
          </label>
        </div>
      </section>

      <section>
        <h2 data-i18n="settings.hotkeys"></h2>
        <p class="hint" data-i18n="settings.hotkeysHint"></p>

        <div class="row">
          <label for="hk-capture" data-i18n="settings.capture"></label>
          <button class="hotkey" id="hk-capture" data-key="capture" type="button"></button>
          <button class="link" data-reset="capture" type="button" data-i18n="settings.reset"></button>
        </div>

        <div class="row">
          <label for="hk-record" data-i18n="settings.record"></label>
          <button class="hotkey" id="hk-record" data-key="record" type="button"></button>
          <button class="link" data-reset="record" type="button" data-i18n="settings.reset"></button>
        </div>
      </section>

      <section>
        <h2 data-i18n="settings.saveLocation"></h2>
        <p class="hint" data-i18n="settings.saveLocationHint"></p>

        <div class="row path-row">
          <input type="text" id="save-dir" spellcheck="false" readonly />
          <button class="ghost" id="btn-browse" type="button" data-i18n="settings.browse"></button>
          <button class="ghost" id="btn-open" type="button" data-i18n="settings.open"></button>
        </div>
        <button class="link" id="btn-reset-dir" type="button" data-i18n="settings.resetDir"></button>
      </section>

      <section>
        <h2 data-i18n="settings.updates"></h2>

        <div class="row">
          <label data-i18n="settings.version"></label>
          <span class="version" id="app-version"></span>
          <button class="ghost" id="btn-check-update" type="button" data-i18n="settings.checkUpdates"></button>
        </div>

        <div class="row update-row hidden" id="update-row">
          <span class="update-status" id="update-status"></span>
          <button class="primary" id="btn-update-action" type="button"></button>
        </div>

        <div class="row">
          <label for="auto-update" data-i18n="settings.autoUpdateLabel"></label>
          <label class="check">
            <input type="checkbox" id="auto-update" />
            <i></i>
            <span data-i18n="settings.autoUpdate"></span>
          </label>
        </div>
      </section>
    </main>

    <!-- Every change saves as it is made; this line says so, and how it went. -->
    <footer>
      <span id="status"></span>
    </footer>

    <script src="settings.js"></script>
  </body>
</html>
