<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title data-i18n="app.pin">Took</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img id="shot" alt="" draggable="false" />
    <div id="bar">
      <button class="act" id="act-copy" data-i18n-title="pin.copyHint" data-i18n="pin.copy"></button>
      <button class="act" id="act-save" data-i18n-title="pin.saveHint" data-i18n="pin.save"></button>
      <button class="act danger" id="act-close" data-i18n-title="pin.closeHint">✕</button>
    </div>
    <script src="pin.js"></script>
  </body>
</html>
