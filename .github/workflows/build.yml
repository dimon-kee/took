name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the release step needs to upload assets

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # electron-builder downloads a ~120 MB Electron zip plus the winCodeSign
      # helpers on a cold run. Caching them is the difference between a
      # four-minute build and well under one.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      # The text-recognition models (~23 MB) come from ModelScope on install.
      # Restored here, the install's SHA-256 check finds them and skips the
      # download; the key changes whenever the pinned models do.
      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: assets/ocr
          key: ocr-models-${{ hashFiles('tools/fetch-ocr-models.js') }}

      - run: npm ci

      # Renderer code is plain script tags with no build step, so nothing else
      # would catch a syntax error before it ships.
      - name: Syntax check
        shell: bash
        run: |
          for file in $(find src tools -name "*.js"); do
            node --check "$file" || exit 1
          done

      # node --check sees one file at a time; several classic scripts share a
      # page's global scope, so a clash between them only shows up here.
      - name: Cross-script declarations
        run: node tools/check-scripts.js

      - name: Translations
        run: node tools/check-i18n.js

      - name: Scrolling-screenshot stitcher
        run: node tools/check-stitch.js

      # Each recognition step against RapidOCR's answers. The screenshots it
      # also reads live outside git, so CI runs the steps only.
      - name: Text recognition
        run: node tools/check-ocr.js

      - name: Links in recognised text
        run: node tools/check-links.js

      - run: npm run dist

      # What the installer carries: the runtime and models unpacked, the C++
      # runtime beside Took.exe, and recognition working from inside app.asar.
      # A release that cannot read text never gets published.
      - name: Packaged text recognition
        run: npx electron tools/check-ocr-package.js

      - uses: actions/upload-artifact@v4
        with:
          name: Took-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      # latest.yml is what installed copies read to find the new version and
      # its checksum; the blockmap lets them download only what changed.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          generate_release_notes: true
