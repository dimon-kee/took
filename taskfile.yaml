# https://taskfile.dev

version: "3"

output: prefixed

vars:
  PREVIEW_DIR: .preview

tasks:
  default:
    desc: List available commands
    cmds:
      - cmd: task --list
    silent: true

  # ── 跑起来 ──────────────────────────────────────────────
  dev:
    desc: Start the app — it lives in the tray, press Ctrl+Shift+S to capture
    cmds:
      - cmd: npm run dev -- {{.CLI_ARGS}}
    aliases: [d]

  stop:
    desc: Kill Took — both a dev run and an installed build
    cmds:
      # 应用常驻托盘、平时没有窗口，关窗口是关不掉的；改完代码要生效
      # 只能真的把进程杀了重起。一次会连带 GPU / utility 子进程。
      # 开发时进程名是 electron.exe，装了打包版之后是 Took.exe —— 两个都要管。
      - cmd: |
          stopped=""
          for image in electron.exe Took.exe; do
            if taskkill /F /IM "$image" >/dev/null 2>&1; then
              stopped="$stopped $image"
            fi
          done
          if [ -n "$stopped" ]; then
            echo "已停止:$stopped"
          else
            echo "没有在跑的 Took 进程"
          fi
    aliases: [s]

  restart:
    desc: Stop the running instance, then start a fresh one
    cmds:
      - task: stop
      - task: dev
    aliases: [r]

  install:
    desc: Install dependencies
    cmds:
      - cmd: npm install
    aliases: [i]

  # ── 开机自启 ────────────────────────────────────────────
  # 托盘菜单里也有同一个开关。写的是 HKCU 下的 Run 项，只影响当前用户，
  # 不需要管理员权限。打包版和 task dev 共用同一个注册表值，互相覆盖。
  autostart:
    desc: Show whether Took starts with Windows, and what it would launch
    cmds:
      - cmd: npx electron tools/autostart.js status
    aliases: [as]

  autostart:on:
    desc: Start Took with Windows (tray only, no window)
    cmds:
      - cmd: npx electron tools/autostart.js on

  autostart:off:
    desc: Stop starting Took with Windows
    cmds:
      - cmd: npx electron tools/autostart.js off

  # ── 自检 ────────────────────────────────────────────────
  # 取景层是全屏置顶的，出了问题没法挂 DevTools 去看。所以 UI 改动一律先跑
  # preview：它用一张合成的假桌面把每个状态渲染成 PNG，不用真的去截屏。
  preview:
    desc: Render every overlay state against a synthetic desktop into .preview/
    cmds:
      - cmd: npx electron tools/preview-ui.js {{.PREVIEW_DIR}}
      - cmd: npx electron tools/preview-settings.js {{.PREVIEW_DIR}}
    aliases: [p]

  check:settings:
    desc: Exercise the settings store, save-path fallback and hotkey conflict rollback
    cmds:
      - cmd: npx electron tools/check-settings.js

  check:i18n:
    desc: Both languages define the same keys, every key is used, no hardcoded Chinese is left
    cmds:
      - cmd: node tools/check-i18n.js

  check:scripts:
    desc: Scripts sharing a page must not redeclare top-level bindings
    cmds:
      # node --check 看的是单个文件，看不到同一页面里多个脚本之间的重复声明。
      - cmd: node tools/check-scripts.js

  check:clicks:
    desc: Click the screenshot ✓, the recording card's dropdowns and the settings checkbox with real mouse input
    cmds:
      # preview 用的 element.click() 不带 mousedown，按下时就触发的逻辑它测不到。
      - cmd: npx electron tools/check-clicks.js

  check:launch:
    desc: Start Took again while it runs — it must stay in the tray, and the new copy must quit without starting up
    cmds:
      # 数据目录、临时目录和快捷键都用自己的，不碰真的 Took。托盘里会多出一个
      # 图标几秒钟，右下角会弹一条「已经在运行」的通知。
      - cmd: node tools/check-launch.js

  check:stitch:
    desc: Stitch synthetic scrolling pages with known answers and check every offset and pixel
    cmds:
      - cmd: node tools/check-stitch.js {{.CLI_ARGS}}

  check:longshot:
    desc: Run a scrolling screenshot end to end through the real overlay and a live stream
    cmds:
      # 会在主屏幕上盖几秒覆盖层，期间别动鼠标 —— 指针也会被抓进画面。
      - cmd: npx electron tools/check-longshot.js

  check:update:
    desc: Run the updater against a local stand-in for GitHub (-- --live for the real releases)
    cmds:
      - cmd: npx electron tools/check-update.js {{.CLI_ARGS}}

  check:install:
    desc: Install, update and uninstall the built installer for real, and check nothing is left
    cmds:
      # 真的装、更新、卸载一遍。先 task dist，再关掉开发版（task stop）。
      # 从旧版本更新上来：task check:install -- --from <旧安装包>
      - cmd: node tools/check-install.js {{.CLI_ARGS}}

  check:clipboard:
    desc: Copy an image, a file and text for real, and read them back from another process
    cmds:
      # 会临时占用剪贴板，跑完把原来的内容放回去。
      - cmd: npx electron tools/check-clipboard.js

  check:latency:
    desc: Time the hotkey-to-overlay path, and confirm the grabbed frame is not blank
    cmds:
      - cmd: npx electron tools/check-latency.js {{.CLI_ARGS | default 3}}

  check:capture-speed:
    desc: Break down why desktopCapturer is slow, versus a MediaStream frame grab
    cmds:
      - cmd: npx electron tools/check-capture-speed.js {{.CLI_ARGS | default 3}}

  check:flash:
    desc: Film the overlay appearing and check for a black frame
    cmds:
      # 会短暂弹出一个真实的覆盖层，几秒后自己消失。
      - cmd: npx electron tools/check-flash.js

  check:capture:
    desc: Report each display's bounds, scale factor and the resolution actually captured
    cmds:
      - cmd: npx electron tools/check-capture.js

  check:media:
    desc: Probe MediaRecorder codecs, desktop loopback audio and available devices
    cmds:
      - cmd: npx electron tools/check-media.js

  check:record:
    desc: Record a few seconds as MP4 and GIF, then verify container structure and frame count
    cmds:
      # 录出来的片子是你真实屏幕的内容，验完顺手删掉。
      - cmd: npx electron tools/check-record.js {{.CLI_ARGS | default 4}}
      - cmd: rm -rf "${TEMP:-/tmp}/took-record-check"

  check:
    desc: Run every diagnostic
    cmds:
      - task: check:i18n
      - task: check:scripts
      - task: check:settings
      - task: check:clicks
      - task: check:launch
      - task: check:stitch
      - task: check:longshot
      - task: check:update
      - task: check:clipboard
      - task: check:capture
      - task: check:latency
      - task: check:media
      - task: check:record
    aliases: [c]

  # ── 打包 ────────────────────────────────────────────────
  icons:
    desc: Regenerate assets/*.png from code (the repo keeps no binary art)
    cmds:
      - cmd: node tools/make-icons.js

  dist:
    desc: Build the Windows installer into dist/
    cmds:
      - task: icons
      - cmd: npm run dist

  clean:
    desc: Remove build output and preview renders
    cmds:
      - cmd: rm -rf dist
      - cmd: rm -rf {{.PREVIEW_DIR}}
